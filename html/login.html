<!doctype html>
<!-- No AI has been used in making of this Site.  -->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>RiRead</title>
		<script
			src="https://kit.fontawesome.com/8d7e09f720.js"
			crossorigin="anonymous"></script>
		<link rel="stylesheet" href="./../css/style.css" />
	</head>
	<body class="bgCol-background">
		<main>
			<section class="container login grid justCenter alignCenter">
				<div class="flex flex-dirCol justCenter">
					<h1 class="txtCenter">Login</h1>
					<form action="/" method="get" class="flex flex-dirCol">
						<label for="Email:">Email:</label>
						<input type="email" id="Email" />
						<label for="Pass">Password</label>
						<input type="password" id="Pass" />
						<button class="btn btn-block">Login</button>
					</form>
					<hr />
					<p class="txtCenter">Or Login Using:</p>
					<div class="social flex">
						<a href="" class="">
							<i class="fa-xl fa-brands fa-google"></i>
						</a>
						<a href="" class="">
							<i class="fa-xl fa-brands fa-apple"></i>
						</a>
						<a href="" class="">
							<i class="fa-xl fa-brands fa-github"></i>
						</a>
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
